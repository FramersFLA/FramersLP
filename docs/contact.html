<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Framers Linguistic Protocol</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-[#1f1f1f] text-white">
  <header class="fixed top-0 w-full bg-[#101010] shadow-md z-50">
    <nav class="max-w-5xl mx-auto flex justify-between items-center px-4 py-3">
      <div class="text-2xl font-bold">FLP</div>
      <ul class="flex space-x-4 text-lg">
        <li><a href="index.html" class="hover:underline">Home</a></li>
        <li><a href="about.html" class="hover:underline">About</a></li>
        <li><a href="faq.html" class="hover:underline">FAQ</a></li>
        <li><a href="contact.html" class="underline">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="pt-24 px-6 max-w-2xl mx-auto">
    <h1 class="text-4xl font-semibold mb-6">Contact Us</h1>
    <form action="https://formsubmit.co/foundersfla@gmail.com" method="POST" class="space-y-4 bg-[#2b2b2b] p-6 rounded-xl shadow-lg">
      <input type="hidden" name="_next" value="https://framersfla.github.io/thanks.html">
      <input type="hidden" name="_captcha" value="false">

      <div>
        <label for="name" class="block mb-1">Name</label>
        <input type="text" id="name" name="name" required class="w-full px-3 py-2 rounded bg-[#1f1f1f] text-white border border-gray-600" />
      </div>

      <div>
        <label for="email" class="block mb-1">Email</label>
        <input type="email" id="email" name="email" required class="w-full px-3 py-2 rounded bg-[#1f1f1f] text-white border border-gray-600" />
      </div>

      <div>
        <label for="message" class="block mb-1">Message</label>
        <textarea id="message" name="message" rows="5" required class="w-full px-3 py-2 rounded bg-[#1f1f1f] text-white border border-gray-600"></textarea>
      </div>

      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded">
        Send Message
      </button>
    </form>
  </main>

  <footer class="mt-20 text-center py-4 text-gray-400 text-sm">
    &copy; 2025 Framers Linguistic Protocol. All rights reserved.
  </footer>
</body>
</html>
